<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">《消失的星空》手机端关键帧设计板 v3</title>
  <desc id="desc">六个手机关键帧展示首屏、星等教学、十八年情景、地点路线、照明对照与静态回退。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11141d"/><stop offset="1" stop-color="#090b11"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070910"/><stop offset=".7" stop-color="#0d111b"/><stop offset="1" stop-color="#251d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="80%">
      <stop offset="0" stop-color="#d38b4a" stop-opacity=".45"/><stop offset="1" stop-color="#070910" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .board-title{font:700 48px "Noto Serif SC","Songti SC",serif;fill:#f5f0e6}
      .board-sub{font:400 18px Inter,"PingFang SC",sans-serif;fill:#9da6b5}
      .phone{fill:#05070c;stroke:#4b5361;stroke-width:3;rx:34}
      .screen{fill:#0b0e16;rx:24}
      .tag{font:700 13px Inter,"PingFang SC",sans-serif;fill:#f1c56a;letter-spacing:1px}
      .h1{font:700 35px "Noto Serif SC","Songti SC",serif;fill:#f5f0e6}
      .h2{font:700 25px "Noto Serif SC","Songti SC",serif;fill:#f5f0e6}
      .copy{font:400 14px Inter,"PingFang SC",sans-serif;fill:#d3d8e1}
      .small{font:400 11px Inter,"PingFang SC",sans-serif;fill:#9da6b5}
      .star{fill:#f5f0e6}.warm{fill:#ffd9a3}.cool{fill:#dcecff}
      .tracked{fill:none;stroke:#f1c56a;stroke-width:2}
      .threshold{stroke:#f1c56a;stroke-width:2.5}
      .button{fill:#1b202b;stroke:#505969;rx:15}
      .button-on{fill:#f1c56a;stroke:#f1c56a;rx:15}
      .bt{font:600 11px Inter,"PingFang SC",sans-serif;fill:#f5f0e6}
      .btd{font:700 11px Inter,"PingFang SC",sans-serif;fill:#1c1811}
      .frame-label{font:700 15px Inter,"PingFang SC",sans-serif;fill:#83c5d5}
    </style>
  </defs>
  <rect width="1800" height="1320" fill="url(#bg)"/>
  <text x="54" y="74" class="board-title">消失的星空｜手机端与回退关键帧 v3</text>
  <text x="56" y="110" class="board-sub">不是桌面双栏的缩小版：星空置顶、纵向星等梯、路线节点、上下A/B、离散减少动态状态</text>

  <!-- MKF01 -->
  <g transform="translate(54 160)">
    <text x="135" y="-18" text-anchor="middle" class="frame-label">MKF01 · HERO</text>
    <rect width="270" height="1010" class="phone"/>
    <rect x="10" y="10" width="250" height="990" class="screen"/>
    <rect x="24" y="28" width="222" height="540" rx="18" fill="url(#night)"/>
    <rect x="24" y="28" width="222" height="540" rx="18" fill="url(#glow)"/>
    <g filter="url(#sg)">
      <circle cx="105" cy="118" r="4" class="warm"/><circle cx="188" cy="137" r="3.2" class="cool"/>
      <circle cx="137" cy="240" r="2.7" class="star"/><circle cx="155" cy="249" r="2.5" class="star"/>
      <circle cx="174" cy="257" r="2.6" class="star"/><circle cx="105" cy="418" r="3.4" class="star"/>
      <circle cx="206" cy="437" r="4" class="cool"/>
    </g>
    <text x="34" y="610" class="tag">纽约冬夜 · 猎户座</text>
    <text x="34" y="662" class="h1">消失的</text><text x="34" y="704" class="h1">星空</text>
    <text x="34" y="754" class="copy">熟悉的亮星还在，</text><text x="34" y="778" class="copy">所以它看起来几乎完整。</text>
    <text x="34" y="936" class="small">向下滚动，从最亮的骨架开始</text>
  </g>

  <!-- MKF02 -->
  <g transform="translate(340 160)">
    <text x="135" y="-18" text-anchor="middle" class="frame-label">MKF02 · STICKY TEACH</text>
    <rect width="270" height="1010" class="phone"/>
    <rect x="10" y="10" width="250" height="990" class="screen"/>
    <rect x="24" y="28" width="222" height="570" rx="18" fill="url(#night)"/>
    <text x="38" y="58" class="tag">一条看不见的边界</text>
    <g filter="url(#sg)">
      <circle cx="88" cy="157" r="4" class="cool"/><circle cx="180" cy="425" r="2" class="star"/>
    </g>
    <circle cx="180" cy="425" r="11" class="tracked"/>
    <text x="38" y="530" class="copy">两颗星都在。</text>
    <text x="38" y="554" class="copy">较暗的一颗贴近背景。</text>
    <rect x="24" y="620" width="222" height="300" rx="16" fill="#111620" stroke="#3f4856"/>
    <text x="40" y="654" class="tag">STEP 02 / 08</text>
    <text x="40" y="700" class="h2">记住这颗星</text>
    <text x="40" y="738" class="copy">接下来，我们会看着它</text>
    <text x="40" y="762" class="copy">一次次跨过肉眼边界。</text>
    <line x1="40" y1="872" x2="226" y2="872" stroke="#424b59"/>
    <circle cx="86" cy="872" r="5" fill="#f1c56a"/><circle cx="120" cy="872" r="4" fill="#424b59"/><circle cx="154" cy="872" r="4" fill="#424b59"/>
  </g>

  <!-- MKF03 -->
  <g transform="translate(626 160)">
    <text x="135" y="-18" text-anchor="middle" class="frame-label">MKF03 · VERTICAL RAIL</text>
    <rect width="270" height="1010" class="phone"/>
    <rect x="10" y="10" width="250" height="990" class="screen"/>
    <text x="28" y="56" class="tag">数字越小，星越亮</text>
    <line x1="95" y1="108" x2="95" y2="650" stroke="#676f7d"/>
    <g class="small">
      <text x="74" y="114">0</text><text x="74" y="294">2</text><text x="74" y="474">4</text><text x="74" y="654">6</text>
    </g>
    <circle cx="95" cy="240" r="5" class="cool" filter="url(#sg)"/>
    <text x="120" y="244" class="copy">亮星 · 实心</text>
    <circle cx="95" cy="536" r="10" class="tracked"/>
    <text x="120" y="540" class="copy">追踪星 · 空心</text>
    <line x1="50" y1="440" x2="232" y2="440" class="threshold"/>
    <rect x="116" y="390" width="118" height="42" rx="8" fill="#252113" stroke="#f1c56a"/>
    <text x="128" y="408" class="tag">当前可见边界</text>
    <text x="128" y="424" class="small">估计区间</text>
    <rect x="24" y="710" width="222" height="228" rx="16" fill="#111620" stroke="#3f4856"/>
    <text x="40" y="748" class="h2">边界移动一点</text>
    <text x="40" y="782" class="copy">跨过去的却是一群星。</text>
    <rect x="40" y="846" width="82" height="34" class="button-on"/><text x="81" y="867" text-anchor="middle" class="btd">较暗状态</text>
    <rect x="132" y="846" width="82" height="34" class="button"/><text x="173" y="867" text-anchor="middle" class="bt">城市状态</text>
  </g>

  <!-- MKF04 -->
  <g transform="translate(912 160)">
    <text x="135" y="-18" text-anchor="middle" class="frame-label">MKF04 · CITY ROUTE</text>
    <rect width="270" height="1010" class="phone"/>
    <rect x="10" y="10" width="250" height="990" class="screen"/>
    <rect x="24" y="28" width="222" height="390" rx="18" fill="url(#night)"/>
    <rect x="24" y="28" width="222" height="390" rx="18" fill="url(#glow)"/>
    <g filter="url(#sg)">
      <circle cx="95" cy="94" r="4" class="warm"/><circle cx="190" cy="110" r="3.2" class="cool"/>
      <circle cx="135" cy="190" r="2.7" class="star"/><circle cx="155" cy="198" r="2.5" class="star"/>
      <circle cx="176" cy="206" r="2.6" class="star"/><circle cx="98" cy="333" r="3.4" class="star"/>
      <circle cx="207" cy="350" r="4" class="cool"/>
    </g>
    <text x="38" y="386" class="tag">TIMES SQUARE</text>
    <text x="28" y="466" class="h2">一座城，不止一片夜空</text>
    <path d="M40 604 C86 580 127 555 230 500" fill="none" stroke="#6f8293" stroke-width="3"/>
    <g>
      <circle cx="42" cy="604" r="9" fill="#d38b4a"/><circle cx="42" cy="604" r="15" fill="none" stroke="#f1c56a"/>
      <circle cx="88" cy="580" r="7" fill="#9b8fc8"/><circle cx="132" cy="554" r="7" fill="#9b8fc8"/>
      <circle cx="179" cy="529" r="7" fill="#9b8fc8"/><circle cx="230" cy="500" r="7" fill="#83c5d5"/>
    </g>
    <text x="28" y="664" class="copy">模型年份 · 区间 · 附近观测覆盖</text>
    <rect x="28" y="712" width="110" height="40" class="button-on"/><text x="83" y="737" text-anchor="middle" class="btd">时代广场</text>
    <rect x="146" y="712" width="100" height="40" class="button"/><text x="196" y="737" text-anchor="middle" class="bt">中央公园</text>
    <rect x="28" y="762" width="104" height="40" class="button"/><text x="80" y="787" text-anchor="middle" class="bt">牙买加湾</text>
    <rect x="140" y="762" width="106" height="40" class="button"/><text x="193" y="787" text-anchor="middle" class="bt">较暗参照</text>
    <rect x="28" y="850" width="218" height="56" rx="14" fill="#111620" stroke="#3f4856"/>
    <text x="137" y="884" text-anchor="middle" class="copy">展开真实地图</text>
  </g>

  <!-- MKF05 -->
  <g transform="translate(1198 160)">
    <text x="135" y="-18" text-anchor="middle" class="frame-label">MKF05 · A/B STACK</text>
    <rect width="270" height="1010" class="phone"/>
    <rect x="10" y="10" width="250" height="990" class="screen"/>
    <text x="28" y="54" class="tag">不是把城市关掉</text>
    <text x="28" y="98" class="h2">改变光去哪里</text>
    <rect x="28" y="132" width="218" height="300" rx="16" fill="#11151d" stroke="#47505e"/>
    <text x="44" y="160" class="tag">A · 未遮罩</text>
    <path d="M137 352 L70 188 M137 352 L137 174 M137 352 L210 196" stroke="#d38b4a" stroke-width="7" opacity=".6"/>
    <path d="M137 352 L62 382 M137 352 L212 382" stroke="#f0d6a4" stroke-width="13" opacity=".45"/>
    <line x1="137" y1="330" x2="137" y2="394" stroke="#b4b8bf" stroke-width="6"/>
    <rect x="112" y="316" width="50" height="18" rx="4" fill="#f0d6a4"/>
    <line x1="48" y1="394" x2="226" y2="394" stroke="#8d8170"/>
    <rect x="28" y="454" width="218" height="300" rx="16" fill="#11151d" stroke="#47505e"/>
    <text x="44" y="482" class="tag">B · 完全遮罩</text>
    <path d="M137 674 L65 708 M137 674 L209 708" stroke="#f0d6a4" stroke-width="14" opacity=".5"/>
    <line x1="137" y1="652" x2="137" y2="716" stroke="#b4b8bf" stroke-width="6"/>
    <path d="M106 638 L168 638 L158 660 L116 660Z" fill="#f0d6a4"/>
    <line x1="48" y1="716" x2="226" y2="716" stroke="#8d8170"/>
    <text x="28" y="800" class="copy">同一地面任务区域，</text><text x="28" y="824" class="copy">更少无效上射光路。</text>
    <rect x="28" y="876" width="218" height="48" class="button"/>
    <text x="137" y="906" text-anchor="middle" class="bt">方向　亮度　时段　光谱</text>
  </g>

  <!-- MKF06 -->
  <g transform="translate(1484 160)">
    <text x="135" y="-18" text-anchor="middle" class="frame-label">MKF06 · REDUCED / STATIC</text>
    <rect width="270" height="1010" class="phone"/>
    <rect x="10" y="10" width="250" height="990" fill="#f0ebdd" rx="24"/>
    <text x="28" y="52" class="tag" fill="#7f5735">减少动态 / 无脚本</text>
    <text x="28" y="94" font-family='"Noto Serif SC","Songti SC",serif' font-size="25" font-weight="700" fill="#191b21">所有结论仍然存在</text>
    <rect x="28" y="126" width="218" height="170" rx="12" fill="#10141d"/>
    <g filter="url(#sg)">
      <circle cx="90" cy="168" r="4" class="warm"/><circle cx="191" cy="177" r="3.2" class="cool"/>
      <circle cx="136" cy="226" r="2.7" class="star"/><circle cx="157" cy="235" r="2.5" class="star"/>
      <circle cx="177" cy="244" r="2.6" class="star"/>
    </g>
    <text x="28" y="322" font-family='Inter,"PingFang SC",sans-serif' font-size="13" fill="#373a42">城市星空</text>
    <rect x="28" y="348" width="218" height="170" rx="12" fill="#080b12"/>
    <g filter="url(#sg)">
      <circle cx="90" cy="390" r="4" class="warm"/><circle cx="191" cy="399" r="3.2" class="cool"/>
      <circle cx="136" cy="448" r="2.7" class="star"/><circle cx="157" cy="457" r="2.5" class="star"/>
      <circle cx="177" cy="466" r="2.6" class="star"/><circle cx="112" cy="432" r="1.2" class="star"/>
      <circle cx="205" cy="449" r="1.3" class="star"/><circle cx="72" cy="470" r="1.1" class="star"/>
    </g>
    <text x="28" y="544" font-family='Inter,"PingFang SC",sans-serif' font-size="13" fill="#373a42">较暗星空</text>
    <rect x="28" y="576" width="218" height="122" rx="12" fill="#fffaf0" stroke="#c8bead"/>
    <text x="42" y="604" font-family='Inter,"PingFang SC",sans-serif' font-size="12" font-weight="700" fill="#7f5735">状态表</text>
    <text x="42" y="632" font-family='Inter,"PingFang SC",sans-serif' font-size="12" fill="#373a42">阈值前　实心恒星</text>
    <text x="42" y="656" font-family='Inter,"PingFang SC",sans-serif' font-size="12" fill="#373a42">阈值后　空心恒星</text>
    <text x="42" y="680" font-family='Inter,"PingFang SC",sans-serif' font-size="12" fill="#373a42">证据　　模型区间</text>
    <rect x="28" y="732" width="218" height="164" rx="12" fill="#fffaf0" stroke="#c8bead"/>
    <text x="42" y="762" font-family='Inter,"PingFang SC",sans-serif' font-size="12" font-weight="700" fill="#7f5735">地点比较表</text>
    <line x1="42" y1="780" x2="230" y2="780" stroke="#c8bead"/>
    <text x="42" y="806" font-family='Inter,"PingFang SC",sans-serif' font-size="11" fill="#373a42">时代广场　模型区间</text>
    <text x="42" y="832" font-family='Inter,"PingFang SC",sans-serif' font-size="11" fill="#373a42">中央公园　模型区间</text>
    <text x="42" y="858" font-family='Inter,"PingFang SC",sans-serif' font-size="11" fill="#373a42">较暗参照　模型区间</text>
    <text x="28" y="954" font-family='Inter,"PingFang SC",sans-serif' font-size="12" fill="#66645f">不执行动画，不减少证据。</text>
  </g>

  <text x="54" y="1240" class="board-sub">手机端核心变化：星空优先于地图；星等轴纵向化；地点使用路线节点；A/B 上下排列；减少动态改为离散状态。</text>
  <text x="54" y="1276" class="small">v3 mobile design · 2026-07-28 · not production data</text>
</svg>
