name: Deploy DataSlices to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static stories
        run: |
          test -s index.html
          for story in lights-out battery-world-map disappearing-stars ai-cost nyc-heat; do
            test -s "stories/$story/index.html"
            test -s "stories/$story/story.css"
            test -s "stories/$story/story.js"
            node --check "stories/$story/story.js"
          done
          test -s stories/lights-out/data/evidence.json
          test -s stories/lights-out/docs/story-brief.md
          test -s stories/lights-out/docs/data-notes.md
          test -s stories/lights-out/docs/storyboard.md
          test -s stories/lights-out/docs/methodology.md
          test -s stories/lights-out/docs/sources.md
          test -s stories/lights-out/docs/qa-notes.md
          test -s stories/battery-world-map/docs/02-storyboard-wireframes-v2.md
          test -s stories/battery-world-map/docs/methodology.md
          test -s stories/battery-world-map/docs/sources.md
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
